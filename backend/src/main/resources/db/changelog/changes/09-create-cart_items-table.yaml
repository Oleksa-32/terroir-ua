databaseChangeLog:
  - changeSet:
      id: create-cart_items-table
      author: oleksa
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: cart_items
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: cart_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: wine_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: cart_id
            constraintName: fk_cart_items_carts
            referencedTableName: shopping_carts
            referencedColumnNames: user_id
        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: wine_id
            constraintName: fk_cart_items_wines
            referencedTableName: wines
            referencedColumnNames: id