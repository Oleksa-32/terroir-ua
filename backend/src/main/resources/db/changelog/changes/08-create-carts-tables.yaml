databaseChangeLog:
  - changeSet:
      id: create-shopping_carts-table
      author: oleksa
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: shopping_carts
      changes:
        - createTable:
            tableName: shopping_carts
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount
                  type: decimal(19,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false
              - column:
                  name: delivery_price
                  type: decimal(19,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false
              - column:
                  name: total_price
                  type: decimal(19,2)
                  defaultValueNumeric: 0.00
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - addForeignKeyConstraint:
                  constraintName: fk_shopping_carts_users
                  baseTableName: shopping_carts
                  baseColumnNames: user_id
                  referencedTableName: users
                  referencedColumnNames: id