databaseChangeLog:
  - changeSet:
      id: 07-create-wines-table
      author: oleksa
      changes:
        - createTable:
            tableName: wines
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: producer
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: owner_description
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: rate
                  type: decimal(9,2)
                  constraints:
                    nullable: false
              - column:
                  name: aging_method
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: sweetness
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: region
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: variety
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: percentage
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: TINYINT(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false